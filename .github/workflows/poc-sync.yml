name: POC Sync
on:
  pull_request:
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  sync:
    # POC: fire on any PR so we can trigger it ourselves.
    # REAL workflow would gate: if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}

      - name: Make a deterministic "synced" change (stand-in for pin sync)
        run: date -u +"synced-at=%Y-%m-%dT%H:%M:%SZ" > POC_SYNCED.txt

      - name: Commit & push iff changed (GITHUB_TOKEN — does NOT auto-retrigger)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add POC_SYNCED.txt
          git diff --staged --quiet && { echo "no change"; exit 0; }
          git commit -m "chore: poc sync commit"
          git push

      - name: Re-run the required check on the NEW head SHA (workflow_dispatch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run poc-check.yml --ref "${{ github.head_ref }}"
